<div class="barraBusqueda">
  <div class="acciones">
    <table>
      <tr>
        <td><button routerLink="/buscar2" id="buscarRaza">Buscar Raza</button></td>
        
        <td><button routerLink="/crear2" id="crearRaza">Crear Raza</button></td>
      </tr>
    </table>
  </div>
</div>

<div class="formulario">
  <form [formGroup]="formulario" (ngSubmit)="enviar()">
    <div>
      <label>Nombre</label>
      <input pInputText type="text" formControlName="nombre" />
      @if (formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched) {
        <small>Error: Mínimo 3 caracteres</small>
      }
    </div>

    <div>
      <label>Descripción</label>
      <textarea pTextarea formControlName="descripcion"></textarea>
    </div>

    <div>
      <label>Longevidad</label>
      <input pInputText type="text" formControlName="longevidad" />
    </div>

    <div>
      <label>Nivel de corrupción</label>
      <input pInputText type="number" formControlName="nivelCorrupcion" />
    </div>

    <div>
      <label>Región principal</label>
      <p-select [options]="regiones" formControlName="regionPrincipal"></p-select>
    </div>

    <div>
      <label>Afinidad mágica</label>
      <p-selectbutton [options]="afinidades" formControlName="afinidadMagica" />
    </div>

    <div style="margin-top: 15px;">
        <p-button type="submit" [disabled]="formulario.invalid">Guardar Raza</p-button>
    </div>
  </form>
</div>
